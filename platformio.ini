; Puff — DIY 510 battery with puff tracking
;   pio run -e xiao_esp32c3 -t upload    build + flash
;   pio device monitor                   serial console (type 'help')
;   pio test -e native                   safety / power / input unit tests on the host

[platformio]
default_envs = xiao_esp32c3

[env]
test_framework = unity

[env:xiao_esp32c3]
platform = espressif32@6.9.0          ; Arduino core 2.0.x (ledcSetup/ledcAttachPin API)
board = seeed_xiao_esp32c3
framework = arduino
board_build.partitions = partitions_ota.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -DPUFF_STAGE=1
  -DFW_VERSION_MAJOR=0
  -DFW_VERSION_MINOR=1
  -DFW_VERSION_PATCH=0
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Wall

[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra -Werror
test_build_src = no                   ; tests only link the pure lib/ modules
